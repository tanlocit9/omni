name: Python CI

on:
  workflow_call:
    inputs:
      project:
        description: Nx Python project to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  NX_DAEMON: false

jobs:
  verify:
    name: Verify ${{ inputs.project }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.13'
          enable-cache: true
          python-version: '3.14.5'

      - name: Install workspace dependencies
        run: npm ci

      - name: Inspect Nx project targets
        run: npx nx show project ${{ inputs.project }}

      - name: Sync Python dependencies
        run: npx nx run ${{ inputs.project }}:sync

      - name: Lint
        run: npx nx run ${{ inputs.project }}:lint

      - name: Test
        run: npx nx run ${{ inputs.project }}:test

      - name: Build
        run: npx nx run ${{ inputs.project }}:build
