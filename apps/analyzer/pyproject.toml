[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/analyzer/html'
 --cov-report xml:'../../coverage/apps/analyzer/coverage.xml'
 --html='../../reports/apps/analyzer/unittests/html/index.html'
 --junitxml='../../reports/apps/analyzer/unittests/junit.xml'
"""

[project]
name = "analyzer"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14,<4"
readme = 'README.md'
dependencies = [
    "aiokafka>=0.11",
    "asyncpg>=0.30",
    "debugpy>=1.8.20",
    "dotenv>=0.9.9",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "minio>=7.2.0",
    "requests>=2.32.5",
    "ruff>=0.15.1",
    "sqlacodegen>=4.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn-hmr[all]>=0.1.1.8",
    "uvicorn[standard]>=0.39.0",
    "vnstock>=0.2.9.2.3",
    "watchfiles>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["analyzer"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "autopep8>=2.3.1",
    "psycopg2-binary>=2.9",
    "sqlacodegen>=3.0",
    "ruff>=0.8.2",
    "pytest>=8.3.4",
    "pytest-sugar>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-html>=4.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["B008"]  # FastAPI uses Depends() in function defaults by design

fixable = ["ALL"]
unfixable = []
