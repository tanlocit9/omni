[tool.coverage.run]
branch = true
source = ["analytics"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/analytics/html'
 --cov-report xml:'../../coverage/apps/analytics/coverage.xml'
 --html='../../reports/apps/analytics/unittests/html/index.html'
 --junitxml='../../reports/apps/analytics/unittests/junit.xml'
"""

[project]
name = "analytics"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14,<4"
readme = 'README.md'
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.128.8",
    "ruff>=0.15.1",
    "uvicorn-hmr[all]>=0.1.1.8",
    "uvicorn[standard]>=0.39.0",
    "vnstock>=0.2.9.2.3",
    "watchfiles>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["analytics"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "autopep8>=2.3.1",
    "ruff>=0.8.2",
    "pytest>=8.3.4",
    "pytest-sugar>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
