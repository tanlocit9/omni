name: Python CI

on:
  workflow_call:
    inputs:
      project:
        description: Nx Python project to verify
        required: true
        type: string
      integration:
        description: Run the Ingestor publication integration suite separately
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  NX_DAEMON: false
  # Reusable workflows do not inherit the caller workflow's env.
  NX_NO_CLOUD: 'true'
  UV_LOCKED: 'true'

jobs:
  verify:
    name: Verify ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.13'
          enable-cache: true
          python-version: '3.14.5'

      - name: Install workspace dependencies
        run: npm ci

      - name: Inspect Nx project targets
        run: npx nx show project ${{ inputs.project }}

      - name: Validate integration project
        if: inputs.integration
        env:
          PROJECT: ${{ inputs.project }}
        run: test "$PROJECT" = ingestor

      - name: Sync Python dependencies
        run: npx nx run ${{ inputs.project }}:sync-ci

      - name: Lint
        if: ${{ !inputs.integration }}
        run: npx nx run ${{ inputs.project }}:lint

      - name: Test
        if: ${{ !inputs.integration }}
        run: npx nx run ${{ inputs.project }}:test

      - name: Build
        if: ${{ !inputs.integration }}
        # sync-ci above already validates uv.lock with --locked. The Nx build
        # exporter uses --frozen. UV 0.8.13 requires UV_LOCKED to be absent,
        # even setting it to false still conflicts with --frozen.
        run: env -u UV_LOCKED npx nx run ${{ inputs.project }}:build

      - name: Publication integration tests
        if: inputs.integration
        run: npx nx run ingestor:test-integration

      - name: Preserve Python test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ inputs.project }}-${{ inputs.integration && 'integration' || 'unit' }}-reports
          path: |
            reports/
            coverage/
          retention-days: 14
          if-no-files-found: warn
