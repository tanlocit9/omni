name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Nx CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Reset Nx
        run: npx nx reset

      - name: Ensure Gradle wrapper is executable
        run: chmod +x apps/core/gradlew

      - name: Validate Nx project graph
        env:
          NX_DAEMON: false
        run: npx nx show projects --verbose

      - name: Check formatting
        env:
          NX_DAEMON: false
        run: npx nx record -- npx nx format:check --verbose
