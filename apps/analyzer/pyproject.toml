[tool.coverage.run]
branch = true
source = ["analyzer"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/analyzer/html'
 --cov-report xml:'../../coverage/apps/analyzer/coverage.xml'
 --html='../../reports/apps/analyzer/unittests/html/index.html'
 --junitxml='../../reports/apps/analyzer/unittests/junit.xml'
"""

[project]
name = "analyzer"
version = "1.0.0"
description = "Automatically generated by Nx."
readme = 'README.md'
dependencies = [
    "debugpy>=1.8.20",
    "requests>=2.32.5",
    "vnstock>=0.2.9.2.3",
    "omni-py-common",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-html>=4.1.1",
]

[tool.uv.sources]
omni-py-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["analyzer"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["B008"]  # FastAPI uses Depends() in function defaults by design

fixable = ["ALL"]
unfixable = []
