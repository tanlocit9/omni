[tool.coverage.run]
branch = true
source = ["py_common"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = """
 --cov
 --cov-report html:'../../coverage/libs/py-common/html'
 --cov-report xml:'../../coverage/libs/py-common/coverage.xml'
 --html='../../reports/libs/py-common/unittests/html/index.html'
 --junitxml='../../reports/libs/py-common/unittests/junit.xml'
"""

[project]
name = "omni-py-common"
version = "0.1.0"
description = "Shared Python library for Omni platform services"
readme = "README.md"
dependencies = [
    "minio>=7.2.0",
    "pandas>=3.0.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "aiokafka>=0.14.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["py_common"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []