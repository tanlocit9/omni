# S3 Path Configuration
# Defines standardized path structure for the stock-data bucket
# Following conventions: lowercase, kebab-case folders, uppercase ticker files

stock-data:
  bucket: stock-data

  paths:
    # Symbol metadata (exchange-level)
    # Pattern: symbols/{exchange}.parquet
    # Examples: symbols/hose.parquet, symbols/hnx.parquet, symbols/upcom.parquet
    symbols:
      base: 'symbols/'
      pattern: '{exchange}.parquet'

    # End-of-day price data (ticker-level)
    # Pattern: eod/{exchange}/{code}.parquet
    # Examples: eod/hose/hpg.parquet, eod/hnx/shs.parquet, eod/upcom/vci.parquet
    eod:
      base: 'eod/'
      pattern: '{exchange}/{code}.parquet'

    # Technical indicators (ticker-level, by source and timeframe)
    # Pattern: indicators/{source}/{timeframe}/{exchange}/{code}.parquet
    # Examples: indicators/ad_close/1d/hose/hpg.parquet, indicators/ad_close/1d/hnx/shs.parquet
    indicators:
      base: 'indicators/'
      pattern: '{source}/{timeframe}/{exchange}/{code}.parquet'

    # Shared market signal history and actual outcomes
    # One Parquet file per strategy + timeframe + exchange.
    # Pattern: signals/{strategy}/{timeframe}/{exchange}.parquet
    # Examples: signals/trend_momentum_v1/1d/hose.parquet
    signals:
      base: 'signals/'
      pattern: '{strategy}/{timeframe}/{exchange}.parquet'

    # Backward-compatible alias for latest-state consumers.
    # Current Signal V1 derives latest state from the shared history file.
    signal-current:
      base: 'signals/'
      pattern: '{strategy}/{timeframe}/{exchange}.parquet'

    # Symbol-level precomputed features for sector wave analysis.
    # Pattern: features/symbol/{timeframe}/{exchange}/{code}.parquet
    symbol-features:
      base: 'features/symbol/'
      pattern: '{timeframe}/{exchange}/{code}.parquet'

    # Sector-level precomputed features aggregated from symbol features.
    # Pattern: features/sector/{timeframe}/lv{sector_level}/{sector_code}.parquet
    sector-features:
      base: 'features/sector/'
      pattern: '{timeframe}/lv{sector_level}/{sector_code}.parquet'

    # Rule-based sector rotation backtest outputs.
    # Pattern: backtests/sector-rotation/{strategy}/{timeframe}/lv{sector_level}.parquet
    sector-rotation-backtests:
      base: 'backtests/sector-rotation/'
      pattern: '{strategy}/{timeframe}/lv{sector_level}.parquet'

    # Sector Transition research predictions, one row per evaluation date and horizon.
    # Pattern: research/sector-transition/predictions/{strategy}/{timeframe}/lv{sector_level}.parquet
    sector-transition-predictions:
      base: 'research/sector-transition/predictions/'
      pattern: '{strategy}/{timeframe}/lv{sector_level}.parquet'

    # Sector Transition private/internal decision outputs.
    # Pattern: research/sector-transition/decisions/{strategy}/{timeframe}/lv{sector_level}.parquet
    sector-transition-decisions:
      base: 'research/sector-transition/decisions/'
      pattern: '{strategy}/{timeframe}/lv{sector_level}.parquet'

    # Sector Transition historical probability matrices.
    # Pattern: research/sector-transition/probabilities/{strategy}/{timeframe}/lv{sector_level}.parquet
    sector-transition-probabilities:
      base: 'research/sector-transition/probabilities/'
      pattern: '{strategy}/{timeframe}/lv{sector_level}.parquet'

    # Sector Transition evaluated actual outcomes.
    # Pattern: research/sector-transition/outcomes/{strategy}/{timeframe}/lv{sector_level}.parquet
    sector-transition-outcomes:
      base: 'research/sector-transition/outcomes/'
      pattern: '{strategy}/{timeframe}/lv{sector_level}.parquet'

    # Future expansion paths (not yet implemented)
    # These paths are defined for future features

    # Intraday price data (ticker-level)
    # Pattern: intraday/{exchange}/{code}.parquet
    intraday:
      base: 'intraday/'
      pattern: '{exchange}/{code}.parquet'

    # Financial statements (ticker-level, by statement type)
    # Pattern: financials/{code}/{statement_type}.parquet
    # Examples: financials/hpg/income-statement.parquet, financials/hpg/balance-sheet.parquet
    financials:
      base: 'financials/'
      pattern: '{code}/{statement_type}.parquet'

    # Fundamental ratios (ticker-level)
    # Pattern: fundamentals/{code}/ratios.parquet
    fundamentals:
      base: 'fundamentals/'
      pattern: '{code}/ratios.parquet'

    # Corporate actions and events (ticker-level)
    # Pattern: corporate-actions/{code}/events.parquet
    corporate-actions:
      base: 'corporate-actions/'
      pattern: '{code}/events.parquet'

    # Ownership data (ticker-level)
    # Pattern: ownership/{code}/shareholders.parquet
    ownership:
      base: 'ownership/'
      pattern: '{code}/shareholders.parquet'

    # News articles (ticker-level or market-level)
    # Pattern: news/{code}/articles.parquet
    news:
      base: 'news/'
      pattern: '{code}/articles.parquet'

    # Macroeconomic indicators
    # Pattern: macro/{indicator}.parquet
    macro:
      base: 'macro/'
      pattern: '{indicator}.parquet'

    # Derivatives data
    # Pattern: derivatives/{exchange}/{code}.parquet
    derivatives:
      base: 'derivatives/'
      pattern: '{exchange}/{code}.parquet'

    # Warrants data
    # Pattern: warrants/{exchange}/{code}.parquet
    warrants:
      base: 'warrants/'
      pattern: '{exchange}/{code}.parquet'

    # ETF data
    # Pattern: etf/{exchange}/{code}.parquet
    etf:
      base: 'etf/'
      pattern: '{exchange}/{code}.parquet'
# Path Construction Rules:
# 1. All exchange names and codes are lowercase in paths (hose, hnx, upcom, hpg, fpt)
# 2. Folder names use kebab-case (corporate-actions, income-statement)
# 3. No temporal partitioning (dt=/run_id=) - files are overwritten/merged in place
# 4. One ticker = one data file per path type
# 5. Metadata (sector, industry) stored in separate metadata files, not in paths
