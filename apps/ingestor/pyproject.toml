[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/ingestor/html'
 --cov-report xml:'../../coverage/apps/ingestor/coverage.xml'
 --html='../../reports/apps/ingestor/unittests/html/index.html'
 --junitxml='../../reports/apps/ingestor/unittests/junit.xml'
"""

[project]
name = "ingestor"
version = "1.0.0"
description = "Stock Sync Ingestor Microservice."
requires-python = ">=3.14,<4"
readme = 'README.md'
dependencies = [
    "aiokafka>=0.12.0",
    "httpx>=0.28.1",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "minio>=7.2.0",
    "pydantic-settings>=2.7.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "ruff>=0.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestor"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-sugar>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-html>=4.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
