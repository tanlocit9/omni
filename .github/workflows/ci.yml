name: CI

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Full previous commit SHA for contract compatibility comparison
        required: true
        type: string
  push:
    branches:
      - main
      - multi-phase
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: false
  # Run checks without requiring private Nx Cloud workspace access.
  NX_NO_CLOUD: 'true'

jobs:
  affected:
    name: Detect affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      contracts-base: ${{ steps.baseline.outputs.sha }}
      analyzer: ${{ steps.projects.outputs.analyzer }}
      contracts: ${{ steps.projects.outputs.contracts }}
      ingestor: ${{ steps.projects.outputs.ingestor }}
      java: ${{ steps.projects.outputs.java }}
      py-common: ${{ steps.projects.outputs.py-common }}
      query-service: ${{ steps.projects.outputs.query-service }}
      typescript: ${{ steps.projects.outputs.typescript }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Select immutable contract baseline
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.baseline }}
        run: |
          case "$EVENT_NAME" in
            pull_request) baseline="$PR_BASE" ;;
            push) baseline="$PUSH_BEFORE" ;;
            workflow_dispatch) baseline="$MANUAL_BASE" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ || "$baseline" =~ ^0+$ ]]; then
            echo "A nonzero previous commit SHA is required; no implicit bootstrap." >&2
            exit 1
          fi
          git cat-file -e "$baseline^{commit}"
          if [[ "$baseline" == "$(git rev-parse HEAD)" ]]; then
            echo "Contract baseline must differ from the checked-out commit." >&2
            exit 1
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"

      - name: Setup Python for tooling tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'

      - name: Test repository tooling and CI policy
        run: |
          npx nx run omni:tools-test
          npx nx run omni:ci-policy-test
          npx nx run omni:format-test

      - name: Validate Nx project graph
        run: npx nx show projects --verbose

      - name: Check affected formatting
        run: npx nx format:check --base="$NX_BASE" --head="$NX_HEAD" --verbose

      - name: Compute affected stack jobs
        id: projects
        shell: bash
        run: |
          npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --json > "$RUNNER_TEMP/affected.json"
          git diff --name-only --no-renames -z "$NX_BASE" "$NX_HEAD" > "$RUNNER_TEMP/changed-files"
          node tools/ci-policy.cjs select "$RUNNER_TEMP/affected.json" "$RUNNER_TEMP/changed-files" "$GITHUB_OUTPUT" "$GITHUB_EVENT_NAME"

  contracts:
    name: Contracts / protobuf
    needs: affected
    if: needs.affected.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTRACTS_BASE_SHA: ${{ needs.affected.outputs.contracts-base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'

      - name: Install dependencies
        run: npm ci

      - name: Verify contracts
        run: |
          npx nx run contracts:format
          npx nx run contracts:lint
          npx nx run contracts:breaking
          npx nx run contracts:generate-check
          npx nx run contracts:test

  analyzer:
    name: Python / analyzer
    needs: affected
    if: needs.affected.outputs.analyzer == 'true'
    uses: ./.github/workflows/python-ci.yml
    with:
      project: analyzer

  ingestor:
    name: Python / ingestor
    needs: affected
    if: needs.affected.outputs.ingestor == 'true'
    uses: ./.github/workflows/python-ci.yml
    with:
      project: ingestor

  ingestor-integration:
    name: Python / ingestor integration
    needs: affected
    if: needs.affected.outputs.ingestor == 'true'
    uses: ./.github/workflows/python-ci.yml
    with:
      project: ingestor
      integration: true

  query-service:
    name: Python / query-service
    needs: affected
    if: needs.affected.outputs.query-service == 'true'
    uses: ./.github/workflows/python-ci.yml
    with:
      project: query-service

  py-common:
    name: Python / py-common
    needs: affected
    if: needs.affected.outputs.py-common == 'true'
    uses: ./.github/workflows/python-ci.yml
    with:
      project: py-common

  typescript:
    name: TypeScript / omni-console
    needs: affected
    if: needs.affected.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Nx project targets
        run: npx nx show project omni-console

      - name: Lint
        run: npx nx run omni-console:lint

      - name: Typecheck
        run: npx nx run omni-console:typecheck

      - name: Test
        run: npx nx run omni-console:test

      - name: Build
        run: npx nx run omni-console:build

  java:
    name: Java / platform
    needs: affected
    if: needs.affected.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure Gradle wrapper is executable
        run: chmod +x apps/core/gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install workspace dependencies
        run: npm ci

      - name: Inspect Nx project targets
        run: npx nx show project platform

      # Gradle's `build` lifecycle already compiles and runs the test suite.
      # Keeping a separate test step would run the tests twice because the
      # platform build target executes `clean build`.
      - name: Build and test
        run: npx nx run platform:build

      - name: Preserve Java test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-reports
          path: |
            apps/core/build/test-results/
            apps/core/build/reports/tests/
            apps/core/build/reports/jacoco/
          retention-days: 14
          if-no-files-found: warn

  quality-gate:
    name: CI Quality Gate
    if: always()
    needs:
      - affected
      - contracts
      - analyzer
      - ingestor
      - ingestor-integration
      - query-service
      - py-common
      - typescript
      - java
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require success for every selected job
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci-policy.cjs gate
