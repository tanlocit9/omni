services:
  platform:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    container_name: omni-platform
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omni
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: stock-data
    volumes:
      - ./apps/core/src:/app/src:ro

  analyzer:
    build:
      context: .
      dockerfile: apps/analyzer/Dockerfile
    container_name: omni-analyzer
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/omni
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: stock-data
    volumes:
      - ./apps/analyzer/app:/app/app:ro

  ingestor:
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    container_name: omni-ingestor
    restart: always
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: stock-data
    volumes:
      - ./apps/ingestor/app:/app/app:ro
