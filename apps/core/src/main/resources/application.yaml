spring:
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:../../configs/shared/topics.yaml
  application:
    name: platform
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: filesystem:../../database/migrations
    baseline-on-migrate: true
    baseline-version: 1
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: platform-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

app:
  analyzer:
    base-url: ${ANALYZER_BASE_URL:http://localhost:8000}
    connect-timeout: ${ANALYZER_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${ANALYZER_READ_TIMEOUT:PT10S}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:stock-data}
  scheduler:
    zone: ${APP_SCHEDULER_ZONE:Asia/Ho_Chi_Minh}
    instance-id: ${APP_SCHEDULER_INSTANCE_ID:}
    manual-trigger:
      # allow-list is injected directly from .env as the canonical property key
      # app.scheduler.manual-trigger.allow-list (comma-separated, split by Spring
      # Boot relaxed binding).  A YAML scalar placeholder is NOT used here because
      # ${ENV_VAR:} resolves to a single string and is never split into List<String>.
    claim:
      lease-duration: ${APP_SCHEDULER_CLAIM_LEASE_DURATION:PT2M}
      batch-size: ${APP_SCHEDULER_CLAIM_BATCH_SIZE:10}
    global:
      fixedDelayString: '30000'
  seed:
    job-definitions:
      enabled: true
  notifications:
    signal-consumer-group: ${SIGNAL_NOTIFICATIONS_CONSUMER_GROUP:platform-signal-notifications-v1}
    telegram:
      enabled: ${TELEGRAM_NOTIFICATIONS_ENABLED:false}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      operations-chat-id: ${TELEGRAM_OPERATIONS_CHAT_ID:}
      signals-chat-id: ${TELEGRAM_SIGNALS_CHAT_ID:}
      parse-mode: HTML
      api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
      deduplication-cooldown: ${TELEGRAM_DEDUPLICATION_COOLDOWN:PT5M}
      deduplication-max-cache-size: ${TELEGRAM_DEDUPLICATION_MAX_CACHE_SIZE:10000}
      display-time-zone: ${TELEGRAM_DISPLAY_TIME_ZONE:Asia/Bangkok}
      audible-operational-errors: ${TELEGRAM_AUDIBLE_OPERATIONAL_ERRORS:true}

logging:
  level:
    org:
      springframework:
        modulith: DEBUG
      flywaydb: DEBUG
    com:
      omni:
        platform:
          modules:
            thumbnails: DEBUG

min-io:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: 'env'
  endpoint:
    env:
      show-values: 'always'
