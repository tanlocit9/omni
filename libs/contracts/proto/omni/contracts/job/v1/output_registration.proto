syntax = "proto3";

package omni.contracts.job.v1;

import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_package = "com.omni.contracts.job.v1";

// I10 versioned schema; active transport uses the paired JSON adapters.
// Shadow collection is not READY. No physical object paths are carried here.
message OutputRegistrationEvent {
  uint32 schema_version = 1;
  string event_id = 2;
  repeated OutputRegistration registrations = 3;
}

// New enrolled commands publish one terminal result, not registration + status records.
// The existing registration topic accepts this envelope alongside legacy registration.
message WorkerCompletionEvent {
  string kind = 1; // WORKER_COMPLETION_V1
  uint32 schema_version = 2;
  string event_id = 3;
  string atomic_attempt_id = 4;
  WorkerCompletionStatus status = 5;
  // Required for SUCCESS; absent for ERROR. Exactly one registration member.
  OutputRegistrationEvent registration = 6;
}

message WorkerCompletionStatus {
  string job_definition_id = 1;
  string execution_id = 2;
  optional string parent_execution_id = 3;
  string work_type = 4;
  string work_key = 5;
  string status = 6; // SUCCESS or ERROR
  google.protobuf.Struct meta_json = 7;
  optional string new_offset = 8;
  string started_at = 9;
  string finished_at = 10;
  int64 duration_ms = 11;
  optional string error_message = 12;
  int32 records_processed = 13;
}

// registration_id is immutable and reused on replay; it is not a work hash.
message OutputRegistration {
  string registration_id = 1;
  string execution_id = 2;
  string atomic_attempt_id = 3;
  string atomic_work_id = 4;
  string job_type = 5;
  string work_type = 6;
  string work_key = 7;
  string business_date = 8;
  google.protobuf.Struct parameters = 9;
  repeated RegistrationOutputRef required_outputs = 10;
  repeated RegisteredOutput outputs = 11;
  optional string valid_empty_reason = 12;
}

message RegistrationOutputRef {
  string dataset = 1;
  map<string, string> partition = 2;
}

message RegisteredOutput {
  string dataset = 1;
  map<string, string> partition = 2;
  string data_version = 3;
  repeated string coverage_dates = 4;
  int64 row_count = 5;
  int64 total_bytes = 6;
  uint32 schema_version = 7;
  string schema_hash = 8;
  repeated RegisteredColumn columns = 9;
  repeated RegisteredInput inputs = 10;
  RegisteredWorkScope work_scope = 11;
  // Immutable backend version of the canonical logical object; never a physical path.
  optional string storage_version_id = 12;
}

// Coordinates of the data covered by this work, not the entire Parquet object.
// Signal coordinates include model_version when non-null; omitted means a
// legacy/null-version row, never all model versions at the same symbol/date.
message RegisteredWorkScope {
  string atomic_work_id = 1;
  repeated google.protobuf.Struct row_keys = 2;
}

message RegisteredColumn {
  string name = 1;
  string type = 2;
  bool nullable = 3;
}

message RegisteredInput {
  string dataset = 1;
  map<string, string> partition = 2;
  string data_version = 3;
}
