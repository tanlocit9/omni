name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - multi-phase
  pull_request:
    branches:
      - main

env:
  NX_DAEMON: false

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.13'
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Sync query service dependencies
        run: npx nx run query-service:sync

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Fix Gradle wrapper permission
        run: chmod +x apps/core/gradlew

      - name: Verify Java
        run: java -version

      - name: Verify Gradle wrapper
        run: |
          cd apps/core
          ./gradlew --version

      - name: Reset Nx cache
        run: npx nx reset

      - name: Validate Nx project graph
        run: npx nx show projects --verbose

      - name: Check formatting
        run: |
          npx nx format:check \
            --base="$NX_BASE" \
            --head="$NX_HEAD" \
            --verbose

      - name: Verify contracts
        run: |
          npx nx run contracts:format
          npx nx run contracts:lint
          npx nx run contracts:breaking
          npx nx run contracts:generate-check
          npx nx affected -t lint,test \
            --base="$NX_BASE" \
            --head="$NX_HEAD" \
            --exclude=.,py-common,analyzer,ingestor,platform

      - name: Test platform
        run: npx nx run platform:test

      - name: Build platform
        run: npx nx run platform:build
