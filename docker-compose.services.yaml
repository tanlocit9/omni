services:
  platform:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    container_name: omni-platform
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - '8080:8080'
    env_file:
      - .env
      - apps/core/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/omni}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      ANALYZER_BASE_URL: ${ANALYZER_BASE_URL:-http://analyzer:8000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stock-data}
      SYSTEM_OPERATOR_UUID: ${SYSTEM_OPERATOR_UUID:-b252fe62-80f3-4df9-9734-5dc549705a25}
      APP_SCHEDULER_MANUAL_TRIGGER_ALLOW_LIST: ${APP_SCHEDULER_MANUAL_TRIGGER_ALLOW_LIST:-}
    volumes:
      - ./apps/core/src:/app/src:ro

  analyzer:
    build:
      context: .
      dockerfile: apps/analyzer/Dockerfile
    container_name: omni-analyzer
    restart: always
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '8000:8000'
    env_file:
      - .env
      - apps/analyzer/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/omni}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-stock-data}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stock-data}
      METADATA_KAFKA_ENABLED: ${METADATA_KAFKA_ENABLED:-true}
    volumes:
      - ./apps/analyzer/app:/app/app:ro

  ingestor:
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    container_name: omni-ingestor
    restart: always
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_healthy
    env_file:
      - .env
      - apps/ingestor/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-stock-data}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stock-data}
    volumes:
      - ./apps/ingestor/app:/app/app:ro
