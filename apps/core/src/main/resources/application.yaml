spring:
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:../../configs/shared/topics.yaml
  application:
    name: platform
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: filesystem:../../database/migrations
    baseline-on-migrate: true
    baseline-version: 1
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: platform-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

app:
  analyzer:
    base-url: ${ANALYZER_BASE_URL:http://localhost:8000}
    connect-timeout: ${ANALYZER_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${ANALYZER_READ_TIMEOUT:PT10S}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:stock-data}
  scheduler:
    zone: ${APP_SCHEDULER_ZONE:Asia/Ho_Chi_Minh}
    instance-id: ${APP_SCHEDULER_INSTANCE_ID:}
    manual-trigger:
      # allow-list is injected directly from .env as the canonical property key
      # app.scheduler.manual-trigger.allow-list (comma-separated, split by Spring
      # Boot relaxed binding).  A YAML scalar placeholder is NOT used here because
      # ${ENV_VAR:} resolves to a single string and is never split into List<String>.
    claim:
      lease-duration: ${APP_SCHEDULER_CLAIM_LEASE_DURATION:PT2M}
      batch-size: ${APP_SCHEDULER_CLAIM_BATCH_SIZE:10}
    global:
      fixedDelayString: '30000'
  seed:
    job-definitions:
      enabled: true
  notifications:
    signal-consumer-group: ${SIGNAL_NOTIFICATIONS_CONSUMER_GROUP:platform-signal-notifications-v1}
    signal-strategy: ${TELEGRAM_SIGNAL_STRATEGY:CONFIRMED_TREND_EQUALS}
    outbox:
      fixed-delay: ${NOTIFICATION_OUTBOX_FIXED_DELAY:PT5S}
      claim:
        lease-duration: ${NOTIFICATION_OUTBOX_CLAIM_LEASE_DURATION:PT2M}
        batch-size: ${NOTIFICATION_OUTBOX_CLAIM_BATCH_SIZE:10}
      max-attempts: ${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:8}
      retry:
        initial-delay: ${NOTIFICATION_OUTBOX_RETRY_INITIAL_DELAY:PT5S}
        max-delay: ${NOTIFICATION_OUTBOX_RETRY_MAX_DELAY:PT15M}
    telegram:
      enabled: ${TELEGRAM_NOTIFICATIONS_ENABLED:false}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      operations-chat-id: ${TELEGRAM_OPERATIONS_CHAT_ID:}
      signals-chat-id: ${TELEGRAM_SIGNALS_CHAT_ID:}
      parse-mode: HTML
      api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
      deduplication-cooldown: ${TELEGRAM_DEDUPLICATION_COOLDOWN:PT5M}
      deduplication-max-cache-size: ${TELEGRAM_DEDUPLICATION_MAX_CACHE_SIZE:10000}
      display-time-zone: ${TELEGRAM_DISPLAY_TIME_ZONE:Asia/Bangkok}
      audible-operational-errors: ${TELEGRAM_AUDIBLE_OPERATIONAL_ERRORS:true}
      rate-limit: ${TELEGRAM_RATE_LIMIT:PT0.05S}
      signal-filter:
        # Allowed strategies (comma-separated, defaults to CONFIRMED_TREND_EQUALS)
        # Example: CONFIRMED_TREND_EQUALS,TREND_MOMENTUM_V1,ICHIMOKU_V1
        allowed-strategies: ${TELEGRAM_SIGNAL_FILTER_ALLOWED_STRATEGIES:CONFIRMED_TREND_EQUALS}
        # Allowed symbols (comma-separated, empty = all symbols)
        # Example: HOSE-FPT,HOSE-VNM,HNX-ACB
        allowed-symbols: ${TELEGRAM_SIGNAL_FILTER_ALLOWED_SYMBOLS:}
        # Symbol patterns using glob syntax (comma-separated, empty = no patterns)
        # Example: HOSE-*,HNX-*
        symbol-patterns: ${TELEGRAM_SIGNAL_FILTER_SYMBOL_PATTERNS:}
        # Allowed signal directions (comma-separated, empty = all directions)
        # Example: BUY,SELL (excludes HOLD)
        allowed-directions: ${TELEGRAM_SIGNAL_FILTER_ALLOWED_DIRECTIONS:}
        # Allowed timeframes (comma-separated, empty = all timeframes)
        # Example: 1d,4h
        allowed-timeframes: ${TELEGRAM_SIGNAL_FILTER_ALLOWED_TIMEFRAMES:}
        # Minimum score threshold (null/empty = no threshold)
        # Example: 0.7 (only signals with score >= 0.7)
        min-score: ${TELEGRAM_SIGNAL_FILTER_MIN_SCORE:0.7}
        # Enable newSignalDate eligibility for daily confirmed results
        enable-new-signal-date: ${TELEGRAM_SIGNAL_FILTER_ENABLE_NEW_SIGNAL_DATE:true}

logging:
  level:
    org:
      springframework:
        modulith: DEBUG
      flywaydb: DEBUG
    com:
      omni:
        platform:
          modules:
            thumbnails: DEBUG

min-io:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: 'env,health,metrics,prometheus'
  endpoint:
    env:
      show-values: 'always'
